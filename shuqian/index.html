      touch-action: none;
      padding-top: env(safe-area-inset-top, 10px);
      padding-bottom: env(safe-area-inset-bottom, 15px);
    }

    @media (max-width: 520px) {
      .app-viewport {
        max-width: 100vw;
        box-shadow: none;
      }
    }

    /* 顶部仪表区 (1:1 还原原版顶部布局) */
    .top-bar-hud {
      position: absolute;
      top: env(safe-area-inset-top, 15px);
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 30;
      pointer-events: none;
    }

    /* 顶部金额金币 */
    .hud-money-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }

    .coin-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFE082, #FFB300);
      border: 2px solid #FFF8E1;
      color: #6a0000;
      font-weight: 900;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    .hud-money-val {
      font-size: 32px;
      font-weight: 900;
      font-family: 'Impact', Arial, sans-serif;
      color: #FFD700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    /* 倒计时胶囊盒 */
    .hud-timer-pill {
      margin-top: 8px;
      background: rgba(35, 0, 0, 0.65);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 18px;
      padding: 4px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffcccc;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      backdrop-filter: blur(5px);
    }

    .hud-timer-pill strong {
      font-size: 20px;
      color: #FFD700;
      font-family: 'Impact', Arial, sans-serif;
    }

    /* 右上角玩家头像 (1:1 还原橙色圆环头像) */
    .top-right-avatar {
      position: absolute;
      top: env(safe-area-inset-top, 20px);
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #FFA726;
      border: 3px solid #FFE0B2;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      z-index: 35;
      cursor: pointer;
    }

    /* 左侧悬浮标签：游戏规则 (1:1 还原) */
    .left-rule-tab {
      position: absolute;
      left: 0;
      top: 45%;
      transform: translateY(-50%);
      background: rgba(40, 0, 0, 0.75);
      border: 1px solid rgba(255, 215, 0, 0.4);
      border-left: none;
      border-radius: 0 12px 12px 0;
      padding: 12px 6px;
      color: #ffe6e6;
      font-size: 13px;
      writing-mode: vertical-rl;
      letter-spacing: 4px;
      z-index: 35;
      cursor: pointer;
      box-shadow: 2px 4px 12px rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
    }

    /* 屏幕中央：游戏尚未开始 状态展牌 (1:1 还原) */
    .center-status-badge {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(35, 0, 0, 0.85);
      border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: 12px;
      padding: 16px 36px;
      color: #ffffff;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 1px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      z-index: 25;
      text-align: center;
      transition: all 0.3s;
    }

    .center-status-badge.sub-tip {
      font-size: 12px;
      color: #ffcccc;
      margin-top: 6px;
    }

    /* 底部钞票与操作舞台 */
    .bottom-arena {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      z-index: 10;
    }

    .swipe-zone {
      width: 86%;
      max-width: 320px;
      height: clamp(210px, 46vh, 310px);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 800px;
      margin-bottom: clamp(15px, 4vh, 35px);
    }

    /* 真实底包厚度 */
    .deck-stack {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: clamp(140px, 25vh, 175px);
      border-radius: 8px;
      box-shadow: 0 16px 30px rgba(0,0,0,0.75);
      background: #7a0815;
      overflow: hidden;
    }

    .deck-stack img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    /* 手指当前推移的百元大钞 */
    .deck-card {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: clamp(140px, 25vh, 175px);
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      cursor: grab;
      z-index: 15;
      transform-origin: center bottom;
    }

    .deck-card img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    /* 翻飞升空的钞票动效 */
    .fly-note-anim {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: clamp(140px, 25vh, 175px);
      pointer-events: none;
      z-index: 25;
      animation: shootToSky 0.22s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    .fly-note-anim img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    .swipe-guide-hand {
      position: absolute;
      bottom: clamp(155px, 27vh, 190px);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 20;
      animation: hintUp 1.2s infinite;
    }

    .swipe-guide-hand .arrow { font-size: 32px; color: #FFD700; filter: drop-shadow(0 2px 6px #000); }
    .swipe-guide-hand .txt { font-size: 14px; font-weight: 800; color: #FFD700; letter-spacing: 2px; text-shadow: 0 2px 4px #000; }

    /* 规则说明弹窗 */
    .rule-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .rule-card {
      background: #2b0005;
      border: 2px solid #FFD700;
      border-radius: 20px;
      padding: 26px 22px;
      width: 85%;
      max-width: 320px;
      color: #fff;
      text-align: center;
    }

    .rule-card h3 { color: #FFD700; font-size: 20px; margin-bottom: 14px; }
    .rule-card p { font-size: 14px; color: #ffcccc; line-height: 1.8; margin-bottom: 20px; text-align: left; }
    .btn-rule-close {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      border: 1px solid #FFD700;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      padding: 8px 30px;
      border-radius: 20px;
      cursor: pointer;
    }

    /* 结算界面 */
    .result-sheet {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 88%;
      max-width: 340px;
      background: rgba(30, 0, 0, 0.95);
      border: 2px solid #FFD700;
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.85);
      backdrop-filter: blur(14px);
      z-index: 50;
      animation: fadeIn 0.4s ease-out;
    }

    .res-crown { font-size: 56px; margin-bottom: 6px; }
    .res-title { font-size: 24px; font-weight: 900; color: #FFD700; margin-bottom: 16px; }
    .res-stat-box { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 14px; margin-bottom: 20px; }
    .res-stat-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 15px; color: #ffe6e6; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .res-stat-row:last-child { border-bottom: none; }
    .res-stat-row strong { color: #FFD700; font-family: 'Impact', Arial; font-size: 18px; }
    .btn-res-play {
      width: 100%;
      height: 46px;
      background: linear-gradient(180deg, #ff416c, #ff4b2b);
      border: 1px solid #FFD700;
      color: #fff;
      font-size: 17px;
      font-weight: 900;
      border-radius: 25px;
      cursor: pointer;
    }

    /* 倒计时巨幕 */
    .countdown-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 90;
    }

    .countdown-num-big {
      font-size: 140px;
      font-weight: 900;
      font-family: 'Impact', sans-serif;
      color: #FFD700;
      text-shadow: 0 0 35px #FFD700, 0 0 70px #ff4b2b;
      animation: cdScale 0.9s ease-out;
    }

    /* 动画 */
    @keyframes shootToSky {
      0% { transform: translateY(0) rotateX(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(-680px) rotateX(45deg) rotateZ(var(--rz, 12deg)) scale(0.85); opacity: 0; }
    }

    @keyframes hintUp {
      0% { transform: translateY(0); opacity: 0.3; }
      50% { transform: translateY(-16px); opacity: 1; }
      100% { transform: translateY(-32px); opacity: 0; }
    }

    @keyframes cdScale {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .hidden { display: none !important; }

      <div class="res-stat-box">
        <div class="res-stat-row">
          <span>数钱总额</span>
          <strong id="stat-money">¥0</strong>
        </div>
        <div class="res-stat-row">
          <span>点钞张数</span>
          <strong id="stat-count">0 张</strong>
        </div>
        <div class="res-stat-row">
          <span>平均手速</span>
          <strong id="stat-speed">0 张/秒</strong>

  <!-- 规则说明浮层 -->
  <div class="rule-modal hidden" id="modal-rules">
    <div class="rule-card">
      <h3>📜 游戏规则</h3>
      <p>
        1. 大屏幕发令倒计时结束即可开抢；<br>
        2. 手指按住钞票向上快速连续滑动推钞；<br>
        3. 每成功滑出一张，计入 ¥100 元；<br>
        4. 30秒内比拼谁推得最多，实时争夺全场金牌数钱王！
      </p>
      <button class="btn-rule-close" id="btn-close-rules">我知道了</button>
    </div>
  </div>

  <!-- 全屏起跑倒计时 -->
  <div class="countdown-layer hidden" id="layer-countdown">
    <div class="countdown-num-big" id="cd-big-num">3</div>
  </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const roomId = urlParams.get('room') || '8888';
      const myId = 'p_' + Math.random().toString(36).substring(2, 9);
      const myName = '现场贵宾';

      const topMoneyVal = document.getElementById('top-money-val');
      const topTimerVal = document.getElementById('top-timer-val');
      const badgeWaiting = document.getElementById('badge-waiting');
      const waitingSubTip = document.getElementById('waiting-sub-tip');
      const swipeHand = document.getElementById('swipe-hand');
      const swipeZone = document.getElementById('swipe-zone');
      const deckCard = document.getElementById('deck-card');

      const btnOpenRules = document.getElementById('btn-open-rules');
      const modalRules = document.getElementById('modal-rules');
      const btnCloseRules = document.getElementById('btn-close-rules');

      const layerCountdown = document.getElementById('layer-countdown');
      const cdBigNum = document.getElementById('cd-big-num');

      const sheetResult = document.getElementById('sheet-result');
      const resCrown = document.getElementById('res-crown');
      const resTitle = document.getElementById('res-title');
      const statMoney = document.getElementById('stat-money');
      const statCount = document.getElementById('stat-count');
      const statSpeed = document.getElementById('stat-speed');
      const btnRestart = document.getElementById('btn-restart');

      let count = 0;
      let remainSeconds = 30;
      let gameTimer = null;
      let isGameActive = false;

      // ================= 1. Web Audio 音效 =================
      let audioCtx = null;
      function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }

      function playFlickSound() {
        if (!audioCtx) return;
        try {
          const bufferSize = audioCtx.sampleRate * 0.035;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 2600;
          filter.Q.value = 3.0;

          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.035);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);
          noise.start();
        } catch(e) {}
      }

      function playBeep(freq, dur) {
        if (!audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        } catch(e) {}
      }

      // ================= 2. 实时通信 (MQTT + BroadcastChannel) =================
      const bChannel = window.BroadcastChannel ? new BroadcastChannel(`shuqian_${roomId}`) : null;
      let mqttClient = null;

      try {
        const brokerUrl = (location.protocol === 'https:' || true) ? 'wss://broker.emqx.io/mqtt' : 'wss://broker.emqx.io:8084/mqtt';
        mqttClient = mqtt.connect(brokerUrl, {
          clientId: 'shuqian_m_' + myId,
          clean: true,
          keepalive: 30,
          connectTimeout: 6000
        });

        mqttClient.on('connect', () => {
          mqttClient.subscribe([`shuqian/${roomId}/start`, `shuqian/${roomId}/over`, `shuqian/${roomId}/reset`]);
          sendJoin();
        });

        mqttClient.on('message', (topic) => {
          if (topic.endsWith('/start')) {
            if (!isGameActive) startCountdown();
          } else if (topic.endsWith('/over')) {
            if (isGameActive) finishGame();
          } else if (topic.endsWith('/reset')) {
            resetGame();
          }
        });
      } catch(e) {}

      if (bChannel) {
        bChannel.onmessage = (e) => {
          const { type } = e.data || {};
          if (type === 'START' && !isGameActive) startCountdown();
          if (type === 'OVER' && isGameActive) finishGame();
          if (type === 'RESET') resetGame();
        };
      }

      function sendJoin() {
        // 轻量化入场数据包 (不到50字节，毫秒级必达，彻底根除被丢包阻断)
        const payload = { id: myId, name: myName, score: 0 };
        if (bChannel) bChannel.postMessage({ type: 'JOIN', data: payload });
        if (mqttClient && mqttClient.connected) {
          mqttClient.publish(`shuqian/${roomId}/join`, JSON.stringify(payload), { qos: 1 });
        }
      }

      function sendSwipe() {
        const payload = { id: myId, name: myName, score: count };
        if (bChannel) bChannel.postMessage({ type: 'SWIPE', data: payload });
        if (mqttClient && mqttClient.connected) {
          mqttClient.publish(`shuqian/${roomId}/swipe`, JSON.stringify(payload));
        }
      }

      sendJoin();

      // 单机测试点击状态条也可开局
      badgeWaiting.addEventListener('click', () => {
        initAudio();
        if (!isGameActive) startCountdown();
      });

      // 规则弹窗
      btnOpenRules.addEventListener('click', () => modalRules.classList.remove('hidden'));
      btnCloseRules.addEventListener('click', () => modalRules.classList.add('hidden'));

      // ================= 3. 倒计时与开局流程 =================
      function startCountdown() {
        initAudio();
        badgeWaiting.classList.add('hidden');
        sheetResult.classList.add('hidden');
        layerCountdown.classList.remove('hidden');

        let cd = 3;
        cdBigNum.textContent = cd;
        playBeep(440, 0.2);

        const timer = setInterval(() => {
          cd--;
          if (cd > 0) {
            cdBigNum.textContent = cd;
            playBeep(440, 0.2);
          } else if (cd === 0) {
            cdBigNum.textContent = 'GO!';
            playBeep(880, 0.35);
          } else {
            clearInterval(timer);
            layerCountdown.classList.add('hidden');
            beginSwiping();
          }
        }, 900);
      }

      function beginSwiping() {
        count = 0;
        remainSeconds = 30;
        isGameActive = true;

        topTimerVal.textContent = remainSeconds;
        topMoneyVal.textContent = '0';
        swipeHand.classList.remove('hidden');

        gameTimer = setInterval(() => {
          remainSeconds--;
          topTimerVal.textContent = remainSeconds;

          if (remainSeconds <= 0) {
            clearInterval(gameTimer);
            finishGame();
          }
        }, 1000);
      }

      function finishGame() {
        isGameActive = false;
        clearInterval(gameTimer);
        playBeep(1046.5, 0.5);

        swipeHand.classList.add('hidden');
        sheetResult.classList.remove('hidden');

        const totalMoney = count * 100;
        const speed = (count / 30).toFixed(1);

        statMoney.textContent = `¥${totalMoney.toLocaleString()}`;
        statCount.textContent = `${count} 张`;
        statSpeed.textContent = `${speed} 张/秒`;

        if (count >= 100) {
          resCrown.textContent = '👑';
          resTitle.textContent = '全场数钱至尊神话';
        } else if (count >= 70) {
          resCrown.textContent = '🥇';
          resTitle.textContent = '金牌点钞大师';
        } else if (count >= 40) {
          resCrown.textContent = '🥈';
          resTitle.textContent = '财富飞跃先锋';
        } else {
          resCrown.textContent = '🥉';
          resTitle.textContent = '迎财纳福能手';
        }
      }

      function resetGame() {
        isGameActive = false;
        clearInterval(gameTimer);
        sheetResult.classList.add('hidden');
        badgeWaiting.classList.remove('hidden');
        topMoneyVal.textContent = '0';
        topTimerVal.textContent = '30';
      }

      btnRestart.addEventListener('click', () => {
        startCountdown();
      });

      // ================= 4. 真实上滑推钞核心手势 =================
      let touchStartY = 0;
      let currentTranslateY = 0;
      let isDragging = false;

      function onTouchStart(e) {
        if (!isGameActive) return;
        touchStartY = e.touches ? e.touches[0].clientY : e.clientY;
        isDragging = true;
      }

      function onTouchMove(e) {
        if (!isDragging || !isGameActive) return;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const deltaY = clientY - touchStartY;

        if (deltaY < 0) {
          currentTranslateY = deltaY;
          deckCard.style.transform = `translateY(${deltaY}px) rotateX(${Math.min(-deltaY * 0.15, 25)}deg)`;
          if (deltaY < -25) swipeHand.classList.add('hidden');
        }
      }

      function onTouchEnd() {
        if (!isDragging || !isGameActive) return;
        isDragging = false;

        if (currentTranslateY < -40) {
          count++;
          playFlickSound();
          if (navigator.vibrate) navigator.vibrate(15);

          topMoneyVal.textContent = (count * 100).toLocaleString();
          sendSwipe();
          spawnFlyNote();
        }

        deckCard.style.transform = 'translateY(0) rotateX(0)';
        currentTranslateY = 0;
      }

      function spawnFlyNote() {
        const note = document.createElement('div');
        note.className = 'fly-note-anim';
